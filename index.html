<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quadball Team Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --ink:#1a2b23;
    --paper:#f5f2ea;
    --field-dark:#1f4a37;
    --college:#2f6b4f;
    --club:#c96a3b;
  }
  html,body{margin:0;padding:0;height:100%;font-family:'Helvetica Neue',Arial,sans-serif;background:var(--paper);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:12px 20px;
    background:var(--field-dark);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:3px solid var(--club);
  }
  header h1{font-size:1.05rem;margin:0;font-weight:600;}
  header .count{font-size:0.78rem;opacity:0.8;margin-top:2px;}

  .toggle{display:flex;border:1.5px solid var(--paper);border-radius:999px;overflow:hidden;font-size:0.82rem;}
  .toggle button{border:none;background:transparent;color:var(--paper);padding:7px 16px;cursor:pointer;}
  .toggle button.active{background:var(--club);color:#fff;}
  .toggle button:not(.active):hover{background:#ffffff22;}

  #map{flex:1;}

  .team-pin{
    width:44px;height:44px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:0.75rem;color:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .team-pin.college{background:var(--college);border:2px solid #16352670;}
  .team-pin.club{background:var(--club);border:2px solid #7a3e2170;}

  .popup-title{font-weight:700;font-size:0.92rem;margin-bottom:3px;}
  .popup-meta{font-size:0.78rem;color:#555;line-height:1.4;}
  .popup-tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;}
  .popup-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.68rem;font-weight:700;color:#fff;}
  .popup-tag.college{background:var(--college);}
  .popup-tag.club{background:var(--club);}
  .popup-tag.status{background:#555;}
  .popup-links{margin-top:6px;font-size:0.78rem;}
  .popup-links a{color:var(--club);text-decoration:none;font-weight:600;}
  .popup-links a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Quadball Team Map</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="toggle" id="toggle">
      <button data-filter="all" class="active">All</button>
      <button data-filter="college">College</button>
      <button data-filter="club">Club</button>
    </div>
  </header>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>

  const teams = [{"name": "Mile High QC", "type": "club", "city": "Denver", "state": "CO", "official": "Official", "email": "milehighquadball@gmail.com", "instagram": "milehighquadball", "logoFile": "mile high logo.png"}, {"name": "Boom Train", "type": "club", "city": "Chicago", "state": "IL", "official": "Official", "email": "boomtrainquidditch@gmail.com", "instagram": "boomtrainquadball", "logoFile": "Boom train logo.png"}, {"name": "Chicago Windchill", "type": "club", "city": "Chicago", "state": "IL", "official": "Official", "email": "chicagowindchill@gmail.com", "instagram": "chicagowindchill", "logoFile": "Chicago Windchill.png"}, {"name": "Chicago United", "type": "club", "city": "Chicago", "state": "IL", "official": "Official", "email": "chicagoquadball@gmail.com", "instagram": "chicagoquadball", "logoFile": "chicago united logo.png"}, {"name": "Ohio Apollos", "type": "club", "city": "Columbus?", "state": "OH", "official": "Official", "email": "ohioapollos@gmail.com", "instagram": "ohioapollos", "logoFile": "Apollos Refresh_V5_2 - Logo.png"}, {"name": "Reign QC", "type": "club", "city": "Omaha", "state": "NE", "official": "Official", "email": "reignqc1@gmail.com", "instagram": "reignqc", "logoFile": "Reign Logo.png"}, {"name": "Trainwreck", "type": "club", "city": "Chicago", "state": "IL", "official": "Official", "email": "boomtrainquidditch@gmail.com", "instagram": "boomtrainquadball", "logoFile": "Trainwreck logo.png"}, {"name": "Atlantic Dragons", "type": "club", "city": "Brooklyn", "state": "NY", "official": "Official", "email": "Adquidditch@gmail.com", "instagram": "dragonsquadball", "logoFile": "Atlantic dragons logo.png"}, {"name": "Boston Lobsters", "type": "club", "city": "Medford", "state": "MA", "official": "Official", "email": "lobstersquadball@gmail.com", "instagram": "lobstersquadball", "logoFile": "Lobsters Logo.jpg"}, {"name": "Boston Mussels", "type": "club", "city": "Medford", "state": "MA", "official": "Official", "email": "lobstersquadball@gmail.com", "instagram": "lobstersquadball", "logoFile": "Mussels Logo.jpg"}, {"name": "Boston Red Pandas", "type": "club", "city": "Cambridge", "state": "MA", "official": "Official", "email": "bostonredpandas@gmail.com", "instagram": "bostonredpandas", "logoFile": "Boston red pandas logo.png"}, {"name": "Carolina Reapers", "type": "club", "city": "Charlotte", "state": "NC", "official": "Official", "email": null, "instagram": "reapersclubquadball", "logoFile": "reapers logo.png"}, {"name": "DCQC", "type": "club", "city": "Washington, DC", "state": null, "official": "Official", "email": "dcquadball@gmail.com", "instagram": "dcquadball", "logoFile": "DCQC.png"}, {"name": "New Jersey Dice", "type": "club", "city": "Secaucaus", "state": "NJ", "official": "Official", "email": "newjerseydice@gmail.com", "instagram": null, "logoFile": "NJ dice logo.png"}, {"name": "New York River Runners", "type": "club", "city": "Troy", "state": "NY", "official": "Official", "email": "capitalregionquadballclub@gmail.com", "instagram": "518riverrunners", "logoFile": "NY River runners logo.jpg"}, {"name": "New York Slice", "type": "club", "city": "New York City", "state": "NY", "official": "Official", "email": "nyslicequadball@gmail.com", "instagram": "nysliceqc", "logoFile": "NY slice logo.png"}, {"name": "Pennsylvania Wolves", "type": "club", "city": "Philadelphia", "state": "PA", "official": "Official", "email": "phillyquidditch@gmail.com", "instagram": "phillyquadball", "logoFile": "PA wolves logo.png"}, {"name": "Vermont United", "type": "club", "city": "Burlington", "state": "VT", "official": "Official", "email": "vtuquadball@gmail.com", "instagram": "vtuquadball", "logoFile": "VT united logo.jpg"}, {"name": "Washington Monuments", "type": "club", "city": "Arlington", "state": "VA", "official": "Official", "email": null, "instagram": "washington.monuments", "logoFile": "WSH monuments logo.jpg"}, {"name": "Orlando Quad ball", "type": "club", "city": "Orlando", "state": "FL", "official": "Official", "email": "orlandoquadball@gmail.com", "instagram": "orlandoquadball", "logoFile": "orlando logo.png"}, {"name": "Houston Cosmos", "type": "club", "city": "Houston", "state": "TX", "official": "Official", "email": "houstoncosmosquadball@gmail.com", "instagram": "houstoncosmosquadball", "logoFile": "houston cosmos logo.png"}, {"name": "Texas Hill Country Heat", "type": "club", "city": "Round Rock", "state": "TX", "official": "Official", "email": "thcquidditch@gmail.com", "instagram": "thchquadball", "logoFile": "Texas Hill Country Heat logo.png"}, {"name": "Lost Boys", "type": "club", "city": "Los Angeles", "state": "CA", "official": "Official", "email": "lostboysquidditch@gmail.com", "instagram": "lostboysqc", "logoFile": "Lost boys logo.png"}, {"name": "Second Stars", "type": "club", "city": "Los Angeles", "state": "CA", "official": "Official", "email": "lostboysquidditch@gmail.com", "instagram": "lostboysqc", "logoFile": "second stars logo.png"}, {"name": "Silicon Valley Vipers", "type": "club", "city": "Mountain View", "state": "CA", "official": "Official", "email": "siliconvalleyvipers@gmail.com", "instagram": "sv_vipers_quidditch", "logoFile": "silicon valley vipers logo.png"}, {"name": "Bay Area Bakers", "type": "club", "city": "San Jose", "state": "CA", "official": "Official", "email": "chefs@bayareabakers.com", "instagram": "bayareabakersqc", "logoFile": "bakers logo.png"}, {"name": "Seattle Sirens", "type": "club", "city": "Seattle", "state": "WA", "official": "Official", "email": null, "instagram": "seattlequadball", "logoFile": "seattle sirens logo.png"}, {"name": "Bay Area Breakers", "type": "club", "city": "Hayward", "state": "CA", "official": "Official", "email": "breakers.leadership@gmail.com", "instagram": "bayareabreakers", "logoFile": "breakers logo.png"}, {"name": "Brew Cities Quadball Club", "type": "club", "city": "Milwaukee", "state": "WI", "official": "Official", "email": "brewcitywarriors.qc@gmail.com", "instagram": "brewcitiesqc", "logoFile": "Brew Cities.png"}, {"name": "Chaos QC", "type": "club", "city": "Bettendorf", "state": "IA", "official": "Official", "email": "chaosquadballclub@gmail.com", "instagram": "chaosquadballclub", "logoFile": "CHAOS logo.jpeg"}, {"name": "Sea Serpents", "type": "club", "city": "Ashland", "state": "WI", "official": "Unofficial", "email": "Bayquidditch@gmail.com", "instagram": null, "logoFile": "SeaSerpent Logo.jpg"}, {"name": "Blue Jay QC", "type": "college", "city": "Omaha", "state": "NE", "official": "Official", "email": "creightonqc@gmail.com", "instagram": "creightonqc", "logoFile": "BlueJayQCLogoUSQ.png"}, {"name": "Bowling Green State Quad ball", "type": "college", "city": "Bowling Green", "state": "OH", "official": "Official", "email": null, "instagram": "bgsuquadball", "logoFile": "Bowling green logo.png"}, {"name": "Creighton QC", "type": "college", "city": "Omaha", "state": "NE", "official": "Official", "email": "creightonqc@gmail.com", "instagram": "creightonqc", "logoFile": "CreightonQuadballLogoFinal.png"}, {"name": "CWRUcio Quad ball", "type": "college", "city": "Cleveland", "state": "OH", "official": "Official", "email": "babsarmy@case.edu", "instagram": "cwrucio_quadball", "logoFile": "CWRUcio logo.png"}, {"name": "Illini Ridgebacks", "type": "college", "city": "Urbana", "state": "IL", "official": "Official", "email": "illiniridgebacks@gmail.com", "instagram": "illiniridgebacks", "logoFile": "Illini logo.png"}, {"name": "Boston University", "type": "college", "city": "Boston", "state": "MA", "official": "Official", "email": "bostonuquidditch@gmail.com", "instagram": "buquadball", "logoFile": "Boston Uni logo.png"}, {"name": "Brandeis", "type": "college", "city": "Waltham", "state": "MA", "official": "Official", "email": "brandeisquadball@gmail.com", "instagram": "brandeisquadball", "logoFile": "brandeis logo.png"}, {"name": "Brown Bears", "type": "college", "city": "Providence", "state": "RI", "official": "Official", "email": "quadball@brown.edu", "instagram": "brownquadball", "logoFile": "Brown bears logo.png"}, {"name": "Emerson College", "type": "college", "city": "Boston", "state": "MA", "official": "Official", "email": "ecqcaptains@gmail.com", "instagram": "ecquadball", "logoFile": "Emerson logo.png"}, {"name": "Harvard Horntails", "type": "college", "city": "Boston", "state": "MA", "official": "Official", "email": "harvardhorntails@gmail.com", "instagram": "harvardquadball", "logoFile": "Harvard logo.png"}, {"name": "JMU", "type": "college", "city": "Harrisonburg", "state": "VA", "official": null, "email": null, "instagram": "jmuclubquadball", "logoFile": "JMU logo.png"}, {"name": "Middlebury", "type": "college", "city": "Middlebury", "state": "VT", "official": "Official", "email": "quadball@middlebury.edu", "instagram": "middleburyquadball", "logoFile": "Middlebury logo.png"}, {"name": "RPI", "type": "college", "city": "Troy", "state": "NY", "official": "Official", "email": null, "instagram": "rpiquadball", "logoFile": "RPI logo.png"}, {"name": "Rutgers University Quad ball", "type": "college", "city": "New Brunswick", "state": "NJ", "official": "Official", "email": "Rutgersquidditch@gmail.com", "instagram": "ruquadball", "logoFile": "Rutgers logo.png"}, {"name": "UNC Chapel Hill", "type": "college", "city": "Chapel Hill", "state": "NC", "official": "Official", "email": null, "instagram": "carolinaquadball", "logoFile": "UNC logo.png"}, {"name": "UNC Wilmington", "type": "college", "city": "Wilmington", "state": "NC", "official": "Unofficial", "email": null, "instagram": "uncwquadball", "logoFile": "UNCW logo.png"}, {"name": "University of Vermont Quad ball", "type": "college", "city": "Burlington", "state": "VT", "official": "Unofficial", "email": "uvmquadball@gmail.com", "instagram": "theuvmq", "logoFile": "Vermont Logo.png"}, {"name": "Virginia Quadball Club", "type": "college", "city": "Charlottesville", "state": "VA", "official": "Official", "email": "joeybeh25@gmail.com", "instagram": "uvaquidditch", "logoFile": "UVA logo.jpg"}, {"name": "Texas State Quadball", "type": "college", "city": "San Marcos", "state": "TX", "official": "Official", "email": "txstquidditch@gmail.com", "instagram": "txstquadball", "logoFile": "Texas State logo.jpg"}, {"name": "Marquette Golden Eagles", "type": "college", "city": "Milwaukee", "state": "WI", "official": "Official", "email": null, "instagram": "marquette.quadball", "logoFile": "Marquette logo.png"}, {"name": "Michigan Quad ball Team", "type": "college", "city": "Ann Arbor", "state": "MI", "official": "Official", "email": null, "instagram": "michquadball", "logoFile": "Michigan logo.png"}, {"name": "Minnesota Quad ball", "type": "college", "city": "Minneapolis", "state": "MN", "official": "Official", "email": "uql@umn.edu", "instagram": "mnquadball", "logoFile": "Minnesota quadball logo.png"}, {"name": "Mizzou", "type": "college", "city": "Columbio", "state": "MO", "official": "Official", "email": "mizzouquidditch@gmail.com", "instagram": "mizclubquadball", "logoFile": "Mizzou Logo.png"}, {"name": "Purdue", "type": "college", "city": "West Lafayette", "state": "IN", "official": "Official", "email": "purduequidditch@gmail.com", "instagram": "purduequadball", "logoFile": "Purdue Logo.png"}, {"name": "QC Pittsburgh", "type": "college", "city": "Pittsburgh", "state": "PA", "official": "Official", "email": null, "instagram": "qcpitt", "logoFile": "Pitt logo.png"}, {"name": "SHSU", "type": "college", "city": "Huntsville", "state": "TX", "official": "Official", "email": "shsuquidditchteam@gmail.com", "instagram": "shsuquadball", "logoFile": "SHSU logo.png"}, {"name": "Texas A&M", "type": "college", "city": "College Station", "state": "TX", "official": "Official", "email": null, "instagram": "tamuquadball", "logoFile": "Texas AM logo.jpg"}, {"name": "Texas Quad ball", "type": "college", "city": "Austin", "state": "TX", "official": "Official", "email": "texasquadball@gmail.com", "instagram": "texasquadball", "logoFile": "Texas Quadball Logo.jpg"}, {"name": "UCLA", "type": "college", "city": "Los Angeles", "state": "CA", "official": "Official", "email": "uclaquidditchteam@gmail.com", "instagram": "uclaquadball", "logoFile": "UCLA logo.png"}, {"name": "UTSA", "type": "college", "city": "San Antonio", "state": "TX", "official": "Official", "email": "UtsaClubQuidditch@gmail.com", "instagram": "utsaquadball", "logoFile": "UTSA logo.jpeg"}];

  function initials(name){
    const words = name.match(/[A-Za-z0-9]+/g) || [];
    if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return name.slice(0,2).toUpperCase();
  }

  const map = L.map('map').setView([39.5, -98.35], 4.3);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    subdomains: 'abc',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(team){
    if(LOGO_BASE_URL && team.logoFile){
      const url = LOGO_BASE_URL + encodeURIComponent(team.logoFile);
      return L.divIcon({
        className: '',
        html: `<div class="team-pin ${team.type}" style="padding:2px;"><img src="${url}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff;" onerror="this.parentElement.innerText='${initials(team.name)}';this.remove();"/></div>`,
        iconSize: [44,44], iconAnchor: [22,22], popupAnchor: [0,-22]
      });
    }
    return L.divIcon({
      className: '',
      html: `<div class="team-pin ${team.type}">${initials(team.name)}</div>`,
      iconSize: [44,44], iconAnchor: [22,22], popupAnchor: [0,-22]
    });
  }

  let clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 });
  map.addLayer(clusterGroup);

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function popupHtml(t){
    const tags = [`<span class="popup-tag ${t.type}">${t.type === 'college' ? 'College' : 'Club'}</span>`];
    if(t.official){
      tags.push(`<span class="popup-tag status">${escapeHtml(t.official)}</span>`);
    }
    const links = [];
    if(t.instagram){
      links.push(`<a href="https://www.instagram.com/${encodeURIComponent(t.instagram)}/" target="_blank" rel="noopener">Instagram</a>`);
    }
    if(t.email){
      links.push(`<a href="mailto:${encodeURIComponent(t.email)}">Email</a>`);
    }
    return `<div class="popup-title">${escapeHtml(t.name)}</div>
      <div class="popup-meta">${t.city ? escapeHtml(t.city) : ''}${t.state ? ', ' + escapeHtml(t.state) : ''}</div>
      <div class="popup-tags">${tags.join('')}</div>
      ${links.length ? `<div class="popup-links">${links.join(' · ')}</div>` : ''}`;
  }

  function render(filter){
    clusterGroup.clearLayers();
    const shown = teams.filter(t => filter === 'all' || t.type === filter);
    shown.forEach(t => {
      const m = L.marker([t.lat, t.lng], { icon: makeIcon(t) }).bindPopup(popupHtml(t));
      clusterGroup.addLayer(m);
    });
    document.getElementById('count').textContent = `${shown.length} teams shown`;
  }

  render('all');

  document.getElementById('toggle').addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#toggle button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    render(e.target.dataset.filter);
  });
</script>
</body>
</html>
