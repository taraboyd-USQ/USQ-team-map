<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quadball Team Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --ink:#1a2b23;
    --paper:#f5f2ea;
    --field-dark:#1f4a37;
    --college:#2f6b4f;
    --club:#c96a3b;
  }
  html,body{margin:0;padding:0;height:100%;font-family:'Helvetica Neue',Arial,sans-serif;background:var(--paper);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:12px 20px;
    background:var(--field-dark);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:3px solid var(--club);
  }
  header h1{font-size:1.05rem;margin:0;font-weight:600;}
  header .count{font-size:0.78rem;opacity:0.8;margin-top:2px;}

  .toggle{display:flex;border:1.5px solid var(--paper);border-radius:999px;overflow:hidden;font-size:0.82rem;}
  .toggle button{border:none;background:transparent;color:var(--paper);padding:7px 16px;cursor:pointer;}
  .toggle button.active{background:var(--club);color:#fff;}
  .toggle button:not(.active):hover{background:#ffffff22;}

  #map{flex:1;}

  .team-pin{
    width:30px;height:30px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:0.6rem;color:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .team-pin.college{background:var(--college);border:2px solid #16352670;}
  .team-pin.club{background:var(--club);border:2px solid #7a3e2170;}

  .popup-title{font-weight:700;font-size:0.92rem;margin-bottom:3px;}
  .popup-meta{font-size:0.78rem;color:#555;line-height:1.4;}
  .popup-tag{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:0.68rem;font-weight:700;color:#fff;}
  .popup-tag.college{background:var(--college);}
  .popup-tag.club{background:var(--club);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Quadball Team Map</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="toggle" id="toggle">
      <button data-filter="all" class="active">All</button>
      <button data-filter="college">College</button>
      <button data-filter="club">Club</button>
    </div>
  </header>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

ty": "Muncie", "state": "IN", "lat": 40.142124, "lng": -85.389874, "logoFile": "Ball State Cardinals logo.png"}, {"name": "Blue Jay QC", "type": "college", "region": "Midwest/Great Lakes", "city": "Omaha", "state": "NE", "lat": 41.266867, "lng": -95.937814, "logoFile": "Blue Jay logo.png"}, {"name": "Bowling Green State Quad ball", "type": "college", "region": "Midwest/Great Lakes", "city": "Bowling Green", "state": "OH", "lat": 41.376449, "lng": -83.613714, "logoFile": "Bowling green logo.png"}, {"name": "Creighton QC", "type": "college", "region": "Midwest/Great Lakes", "city": "Omaha", "state": "NE", "lat": 41.268049, "lng": -95.939405, "logoFile": "CreightonQuadballLogoFinal.png"}, {"name": "CWRUcio Quad ball", "type": "college", "region": "Midwest/Great Lakes", "city": "Cleveland", "state": "OH", "lat": 41.489381, "lng": -81.667486, "logoFile": "CWRUcio logo.png"}, {"name": "Illini Ridgebacks", "type": "college", "region": "Midwest/Great Lakes", "city": "Urbana", "state": "IL", "lat": 40.108966, "lng": -88.211024, "logoFile": "Illini logo.png"}, {"name": "Boston University", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Boston", "state": "MA", "lat": 42.350781, "lng": -71.107529, "logoFile": "Boston Uni logo.png"}, {"name": "Brandeis", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Waltham", "state": "MA", "lat": 42.388938, "lng": -71.2398, "logoFile": "brandeis logo.png"}, {"name": "Brown Bears", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Providence", "state": "RI", "lat": 41.81835, "lng": -71.424851, "logoFile": "Brown bears logo.png"}, {"name": "Emerson College", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Boston", "state": "MA", "lat": 42.353517, "lng": -71.067001, "logoFile": "Emerson logo.png"}, {"name": "Harvard Horntails", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Boston", "state": "MA", "lat": 42.354318, "lng": -71.073449, "logoFile": "Harvard logo.png"}, {"name": "JMU", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Harrisonburg", "state": "VA", "lat": 38.422777, "lng": -78.877137, "logoFile": "JMU logo.png"}, {"name": "Middlebury", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Middlebury", "state": "VT", "lat": 43.991942, "lng": -73.171578, "logoFile": "Middlebury logo.png"}, {"name": "RPI", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Troy", "state": "NY", "lat": 42.748588, "lng": -73.599536, "logoFile": "RPI logo.png"}, {"name": "Rutgers University Quad ball", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "New Brunswick", "state": "NJ", "lat": 40.486754, "lng": -74.444395, "logoFile": "Rutgers logo.png"}, {"name": "UNC Chapel Hill", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Chapel Hill", "state": "NC", "lat": 36.004647, "lng": -79.054475, "logoFile": "UNC logo.png"}, {"name": "University of Vermont Quad ball", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Burlington", "state": "VT", "lat": 44.476622, "lng": -73.209998, "logoFile": "Vermont Logo.png"}, {"name": "Virginia Quadball Club", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Charlottesville", "state": "VA", "lat": 38.026588, "lng": -78.48045, "logoFile": "UVA logo.jpg"}, {"name": "Texas State Quadball", "type": "college", "region": "Southwest", "city": "San Marcos", "state": "TX", "lat": 29.972907, "lng": -97.997166, "logoFile": "Texas State logo.jpg"}, {"name": "Marquette Golden Eagles", "type": "college", "region": "Midwest/Great Lakes", "city": "Milwaukee", "state": "WI", "lat": 43.042191, "lng": -87.935996, "logoFile": "Marquette logo.png"}, {"name": "Michigan Quad ball Team", "type": "college", "region": "Midwest/Great Lakes", "city": "Ann Arbor", "state": "MI", "lat": 42.266638, "lng": -83.849042, "logoFile": "Michigan logo.png"}, {"name": "Minnesota Quad ball", "type": "college", "region": "Midwest/Great Lakes", "city": "Minneapolis", "state": "MN", "lat": 44.984577, "lng": -93.269097, "logoFile": "Minnesota quadball logo.png"}, {"name": "Mizzou", "type": "college", "region": "Midwest/Great Lakes", "city": "Columbio", "state": "MO", "lat": 38.894165, "lng": -92.274145, "logoFile": "Mizzou Logo.png"}, {"name": "Purdue", "type": "college", "region": "Midwest/Great Lakes", "city": "West Lafayette", "state": "IN", "lat": 40.467303, "lng": -86.928132, "logoFile": "Purdue Logo.png"}, {"name": "QC Pittsburgh", "type": "college", "region": "Northeast/Mid-Atlantic", "city": "Pittsburgh", "state": "PA", "lat": 40.47441, "lng": -79.950968, "logoFile": "Pitt logo.png"}, {"name": "SHSU", "type": "college", "region": "Southwest", "city": "Huntsville", "state": "TX", "lat": 30.846986, "lng": -95.597029, "logoFile": "SHSU logo.png"}, {"name": "Texas A&M", "type": "college", "region": "Southwest", "city": "College Station", "state": "TX", "lat": 30.609093, "lng": -96.325984, "logoFile": "Texas AM logo.jpg"}, {"name": "Texas Quad ball", "type": "college", "region": "Southwest", "city": "Austin", "state": "TX", "lat": 30.268335, "lng": -97.741382, "logoFile": "Texas Quadball Logo.jpg"}, {"name": "UCLA", "type": "college", "region": "West", "city": "Los Angeles", "state": "CA", "lat": 33.973951, "lng": -118.248405, "logoFile": "UCLA logo.png"}, {"name": "UTSA", "type": "college", "region": "Southwest", "city": "San Antonio", "state": "TX", "lat": 29.468413, "lng": -98.528889, "logoFile": "UTSA logo.jpeg"}];

  function initials(name){
    const words = name.match(/[A-Za-z0-9]+/g) || [];
    if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return name.slice(0,2).toUpperCase();
  }

  const map = L.map('map').setView([39.5, -98.35], 4.3);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    subdomains: 'abc',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(team){
    if(LOGO_BASE_URL && team.logoFile){
      const url = LOGO_BASE_URL + encodeURIComponent(team.logoFile);
      return L.divIcon({
        className: '',
        html: `<div class="team-pin ${team.type}" style="padding:2px;"><img src="${url}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff;" onerror="this.parentElement.innerText='${initials(team.name)}';this.remove();"/></div>`,
        iconSize: [30,30], iconAnchor: [15,15], popupAnchor: [0,-15]
      });
    }
    return L.divIcon({
      className: '',
      html: `<div class="team-pin ${team.type}">${initials(team.name)}</div>`,
      iconSize: [30,30], iconAnchor: [15,15], popupAnchor: [0,-15]
    });
  }

  let clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 });
  map.addLayer(clusterGroup);

  function popupHtml(t){
    return `<div class="popup-title">${t.name}</div>
      <div class="popup-meta">${t.city || ''}${t.state ? ', ' + t.state : ''}${t.region ? ' · ' + t.region : ''}</div>
      <span class="popup-tag ${t.type}">${t.type === 'college' ? 'College' : 'Club'}</span>`;
  }

  function render(filter){
    clusterGroup.clearLayers();
    const shown = teams.filter(t => filter === 'all' || t.type === filter);
    shown.forEach(t => {
      const m = L.marker([t.lat, t.lng], { icon: makeIcon(t) }).bindPopup(popupHtml(t));
      clusterGroup.addLayer(m);
    });
    document.getElementById('count').textContent = `${shown.length} teams shown`;
  }

  render('all');

  document.getElementById('toggle').addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#toggle button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    render(e.target.dataset.filter);
  });
</script>
</body>
</html>
